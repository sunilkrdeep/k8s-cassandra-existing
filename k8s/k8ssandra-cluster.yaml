apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: cassandra-prod
  namespace: cassandra
spec:
  cassandra:
    clusterName: "aks-cassandra-ring"
    serverVersion: "4.1.3"
    datacenters:
      - metadata:
          name: "dc1" # FIXED: Placed inside a nested metadata block
        size: 1
        storageConfig:
          cassandraDataVolumeClaimSpec:
            storageClassName: "managed-csi-premium"
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
        resources:
          requests:
            memory: 1Gi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
