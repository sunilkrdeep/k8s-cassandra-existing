name: "Deploy Cassandra Application to Existing AKS"

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy_cassandra:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate with Azure using passwordless OIDC Federation
      - name: Azure Login via OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # 2. Connect directly to your EXISTING AKS Cluster
      # Ensure you have replaced these placeholders with your actual running cluster details
      - name: Get AKS Context Credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: 'aks-sutramind-rg'
          cluster-name: 'aks-sutramind'

      # 3. Add official Helm Repositories (CRITICAL: Added jetstack chart indexing here)
      - name: Add Helm Repositories
        run: |
          helm repo remove k8ssandra || true
          helm repo remove jetstack || true
          helm repo add k8ssandra https://helm.k8ssandra.io --force-update
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm repo update
          
      # 4. Create the target namespace using the standardized path
      - name: Create Cassandra Namespace
        run: kubectl apply -f k8s/namespace.yaml

      # 4b. Install Cert-Manager (Now it will find the jetstack repository)
      - name: Install Cert-Manager
        run: |
          helm upgrade --install cert-manager oci://quay.io/jetstack/charts/cert-manager \
            --namespace cert-manager \
            --create-namespace \
            --set installCRDs=true

     # 5. Install the K8ssandra Operator (Control plane layer)
      - name: Install K8ssandra Operator
        run: |
          helm upgrade --install k8ssandra-operator k8ssandra/k8ssandra-operator \
            --namespace cassandra

      # 6. Deploy the actual Cassandra Database Cluster Ring via Native CRD (Bypasses Helm)
      - name: Deploy Cassandra Cluster Ring
        run: |
          kubectl apply -f k8s/k8ssandra-cluster.yaml
          